plugins {
    id 'com.android.application'
}

android {
    namespace 'com.songhuodan.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.songhuodan.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 纯本地应用：无任何第三方依赖
}
